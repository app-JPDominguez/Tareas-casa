<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tareas Casa</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F0E8;
    --surface: #FEFCF7;
    --accent: #C8472A;
    --accent2: #2A6B4F;
    --text: #1A1612;
    --muted: #8A8070;
    --border: #DDD5C0;
    --done-bg: #EAF2EC;
    --done-text: #2A6B4F;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  header {
    background: var(--text);
    color: var(--bg);
    padding: 20px 20px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  header p {
    font-size: 0.75rem;
    color: #A09880;
    margin-top: 2px;
  }

  .add-bar {
    display: flex;
    gap: 8px;
    padding: 14px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 72px;
    z-index: 99;
  }

  .add-bar input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  .add-bar input:focus { border-color: var(--accent); }

  .add-bar button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 1.2rem;
    cursor: pointer;
    transition: opacity 0.2s;
    font-weight: 500;
  }

  .add-bar button:active { opacity: 0.8; }

  .filters {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .filters::-webkit-scrollbar { display: none; }

  .filter-btn {
    white-space: nowrap;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.8rem;
    font-family: 'DM Sans', sans-serif;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .list {
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .task-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 14px 14px 12px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: opacity 0.3s, transform 0.2s;
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .task-card.done {
    background: var(--done-bg);
    border-color: #B8D9C0;
    opacity: 0.75;
  }

  .checkbox {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
    transition: all 0.2s;
    background: white;
  }

  .task-card.done .checkbox {
    background: var(--accent2);
    border-color: var(--accent2);
  }

  .checkbox svg { display: none; }
  .task-card.done .checkbox svg { display: block; }

  .task-body { flex: 1; min-width: 0; }

  .task-text {
    font-size: 0.95rem;
    line-height: 1.4;
    word-break: break-word;
  }

  .task-card.done .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }

  .task-meta {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 5px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  .tag-jp   { background: #FFE8D6; color: #A0420A; }
  .tag-savi { background: #D6E8FF; color: #0A4280; }
  .tag-amb  { background: #EDE0FF; color: #5A1A90; }

  .task-date {
    font-size: 0.68rem;
    color: var(--muted);
  }

  .task-delete {
    background: none;
    border: none;
    cursor: pointer;
    color: #CCC;
    padding: 2px;
    font-size: 1rem;
    line-height: 1;
    flex-shrink: 0;
    transition: color 0.2s;
  }

  .task-delete:active { color: var(--accent); }

  .section-label {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 16px 4px;
  }

  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .empty span { display: block; font-size: 2rem; margin-bottom: 8px; }

  /* Modal para agregar con quién */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }

  .modal-overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 36px;
    width: 100%;
    transform: translateY(100%);
    transition: transform 0.3s ease;
  }

  .modal-overlay.show .modal { transform: translateY(0); }

  .modal h3 {
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    margin-bottom: 6px;
  }

  .modal-task-preview {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 18px;
    font-style: italic;
  }

  .who-btns {
    display: flex;
    gap: 10px;
    margin-bottom: 0;
  }

  .who-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }

  .who-btn[data-who="jp"]   { border-color: #FFBF94; }
  .who-btn[data-who="savi"]  { border-color: #94BEFF; }
  .who-btn[data-who="amb"]  { border-color: #C094FF; }

  .who-btn:active { transform: scale(0.97); }

  .loading {
    text-align: center;
    padding: 30px;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .conn-status {
    font-size: 0.65rem;
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
  }

  .conn-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #888;
  }

  .conn-dot.online { background: #4CAF50; }
</style>
</head>
<body>

<header>
  <h1>🏠 Tareas Casa</h1>
  <div class="conn-status">
    <div class="conn-dot" id="connDot"></div>
    <span id="connText" style="color:#888">Conectando...</span>
  </div>
</header>

<div class="add-bar">
  <input type="text" id="taskInput" placeholder="Nueva tarea..." autocomplete="off" />
  <button id="addBtn">+</button>
</div>

<div class="filters">
  <button class="filter-btn active" data-filter="pending">Pendientes</button>
  <button class="filter-btn" data-filter="all">Todas</button>
  <button class="filter-btn" data-filter="done">Hechas</button>
</div>

<div id="listContainer">
  <div class="loading">Cargando tareas...</div>
</div>

<!-- Modal quién -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>¿Para quién es?</h3>
    <div class="modal-task-preview" id="modalPreview"></div>
    <div class="who-btns">
      <button class="who-btn" data-who="jp">JP</button>
      <button class="who-btn" data-who="savi">Savi</button>
      <button class="who-btn" data-who="amb">Ambos</button>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, updateDoc, deleteDoc, doc, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBge6qTHOdZGlyHR4G8Sh0NBk0V7OuZIcs",
  authDomain: "task-ada38.firebaseapp.com",
  projectId: "task-ada38",
  storageBucket: "task-ada38.firebasestorage.app",
  messagingSenderId: "245999177705",
  appId: "1:245999177705:web:2cca9ec20b194f977a8578"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);
const col = collection(db, "tareas");

// Estado
let tasks = [];
let currentFilter = "pending";
let pendingText = "";

// UI refs
const listContainer = document.getElementById("listContainer");
const taskInput     = document.getElementById("taskInput");
const addBtn        = document.getElementById("addBtn");
const modalOverlay  = document.getElementById("modalOverlay");
const modalPreview  = document.getElementById("modalPreview");
const connDot       = document.getElementById("connDot");
const connText      = document.getElementById("connText");

// Conexión en tiempo real
const q = query(col, orderBy("createdAt", "desc"));
onSnapshot(q, (snap) => {
  tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  connDot.classList.add("online");
  connText.textContent = "En línea";
  connText.style.color = "#4CAF50";
  render();
}, (err) => {
  connText.textContent = "Sin conexión";
  console.error(err);
});

// Agregar tarea
function triggerAdd() {
  const text = taskInput.value.trim();
  if (!text) return;
  pendingText = text;
  modalPreview.textContent = `"${text}"`;
  modalOverlay.classList.add("show");
}

addBtn.addEventListener("click", triggerAdd);
taskInput.addEventListener("keydown", e => { if (e.key === "Enter") triggerAdd(); });

// Modal quién
document.querySelectorAll(".who-btn").forEach(btn => {
  btn.addEventListener("click", async () => {
    const who = btn.dataset.who;
    await addDoc(col, {
      text: pendingText,
      who,
      done: false,
      createdAt: serverTimestamp()
    });
    taskInput.value = "";
    pendingText = "";
    modalOverlay.classList.remove("show");
  });
});

modalOverlay.addEventListener("click", e => {
  if (e.target === modalOverlay) modalOverlay.classList.remove("show");
});

// Toggle done
async function toggleDone(id, current) {
  await updateDoc(doc(db, "tareas", id), { done: !current });
}

// Eliminar
async function deleteTask(id) {
  await deleteDoc(doc(db, "tareas", id));
}

// Filtros
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});

// Render
function render() {
  let filtered = tasks;

  if (currentFilter === "pending") filtered = tasks.filter(t => !t.done);
  else if (currentFilter === "done")    filtered = tasks.filter(t => t.done);
  else if (currentFilter === "jp")      filtered = tasks.filter(t => t.who === "jp");
  else if (currentFilter === "savi")     filtered = tasks.filter(t => t.who === "savi");
  else if (currentFilter === "amb")     filtered = tasks.filter(t => t.who === "amb");

  if (filtered.length === 0) {
    listContainer.innerHTML = `<div class="empty"><span>✓</span>No hay tareas aquí</div>`;
    return;
  }

  const pending = filtered.filter(t => !t.done);
  const done    = filtered.filter(t => t.done);

  let html = "";

  if (pending.length) {
    html += `<div class="section-label">Pendientes · ${pending.length}</div>`;
    html += `<div class="list">` + pending.map(taskHTML).join("") + `</div>`;
  }

  if (done.length) {
    html += `<div class="section-label">Completadas · ${done.length}</div>`;
    html += `<div class="list">` + done.map(taskHTML).join("") + `</div>`;
  }

  listContainer.innerHTML = html;

  // Eventos
  listContainer.querySelectorAll(".checkbox").forEach(el => {
    el.addEventListener("click", () => toggleDone(el.dataset.id, el.dataset.done === "true"));
  });
  listContainer.querySelectorAll(".task-delete").forEach(el => {
    el.addEventListener("click", () => deleteTask(el.dataset.id));
  });
}

function taskHTML(t) {
  const whoLabel = { jp: "JP", savi: "Savi", amb: "Ambos" }[t.who] || "";
  const whoClass = { jp: "tag-jp", savi: "tag-savi", amb: "tag-amb" }[t.who] || "";
  const date = t.createdAt?.toDate
    ? t.createdAt.toDate().toLocaleDateString("es-AR", { day:"2-digit", month:"short" })
    : "";

  return `
    <div class="task-card ${t.done ? "done" : ""}">
      <div class="checkbox" data-id="${t.id}" data-done="${t.done}">
        <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
          <path d="M1 5L4.5 8.5L11 1.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="task-body">
        <div class="task-text">${escHtml(t.text)}</div>
        <div class="task-meta">
          <span class="tag ${whoClass}">${whoLabel}</span>
          ${date ? `<span class="task-date">${date}</span>` : ""}
        </div>
      </div>
      <button class="task-delete" data-id="${t.id}">✕</button>
    </div>`;
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
